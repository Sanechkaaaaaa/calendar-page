<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Summary Meeting</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@2"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      /* Нежно-розовый фон */
      background: linear-gradient(135deg, #ffe4f1, #ffd1e8, #ffc2df);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 14px;
      letter-spacing: 0.4px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 40px;
      line-height: 48px;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 560px;
      font-size: 18px;
      line-height: 28px;
      color: rgba(255, 255, 255, 0.82);
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0 0 32px;
      text-align: left;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .info-label {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.62);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 700;
      line-height: 26px;
    }

    .section {
      text-align: left;
      margin-bottom: 32px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 20px;
      padding: 24px;
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 22px;
    }

    .section ul {
      margin: 0;
      padding-left: 20px;
      color: rgba(255, 255, 255, 0.88);
      line-height: 28px;
      font-size: 17px;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    add-to-calendar-button {
      --atcb-button-box-shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
      --atcb-button-border-radius: 18px;
      --atcb-button-padding: 20px 34px;
      --atcb-button-font-size: 22px;
      --atcb-button-font-weight: 700;
      --atcb-button-text: #0f172a;
      --atcb-button-background: #ffffff;
      --atcb-button-hover-background: #e2e8f0;
      --atcb-button-active-background: #cbd5e1;
      --atcb-dropdown-background: #ffffff;
      --atcb-dropdown-text: #0f172a;
      --atcb-dropdown-border-radius: 16px;
      --atcb-dropdown-box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      --atcb-dropdown-item-hover-background: #f1f5f9;
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 20px;
        border-radius: 22px;
      }

      h1 {
        font-size: 30px;
        line-height: 38px;
      }

      .subtitle {
        font-size: 16px;
        line-height: 24px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .info-value {
        font-size: 17px;
      }

      add-to-calendar-button {
        --atcb-button-width: 100%;
        --atcb-button-padding: 18px 24px;
        --atcb-button-font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Team Event</div>

    <h1>Monthly Summary Meeting</h1>
    <p class="subtitle">
      Team meeting with global discussion.
    </p>

    <div class="info">
      <div class="info-box">
        <div class="info-label">Date</div>
        <div class="info-value">1 May 2026</div>
      </div>
      <div class="info-box">
        <div class="info-label">Time</div>
        <div class="info-value">17:00 – 18:00</div>
      </div>
      <div class="info-box">
        <div class="info-label">Timezone</div>
        <div class="info-value">Europe/Warsaw</div>
      </div>
      <div class="info-box">
        <div class="info-label">Location</div>
        <div class="info-value">Office</div>
      </div>
    </div>

    <div class="section">
      <h2>Agenda</h2>
      <ul>
        <li>Global team discussion</li>
        <li>Private discussions</li>
      </ul>
    </div>

    <div class="button-wrap">
      <add-to-calendar-button
        name="Monthly Summary Meeting"
        startDate="2026-05-01"
        startTime="17:00"
        endTime="18:00"
        timeZone="Europe/Warsaw"
        location="Office"
        description="Team meeting with global discussion first, followed by personal discussions."
        options="'Apple','Google','iCal'"
        label="Add to Calendar"
        size="8"
        lightMode="bodyScheme"
        hideCheckmark
      ></add-to-calendar-button>
    </div>

    <div class="footer">
      Please add the event to your calendar in advance.
    </div>
  </div>
</body>
</html>
