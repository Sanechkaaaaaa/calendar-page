<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Meeting</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/add-to-calendar-button@2"></script>

  <style>
    * { box-sizing: border-box; }

    /* Фон страницы — темно-фиолетовый, но СВЕТЛЕЕ */
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #261038, #3a1756, #4a1b6a);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Карточка — нежно-фиолетовая (как на скрине) */
    .card {
      width: 100%;
      max-width: 680px;
      background: #e7e2f0;
      border: 1px solid rgba(40, 16, 66, 0.10);
      border-radius: 28px;
      padding: 40px 32px;
      box-shadow: 0 26px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
      color: #221238;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 999px;
      background: rgba(124, 77, 255, 0.10);
      border: 1px solid rgba(124, 77, 255, 0.22);
      color: #4a1f86;
      font-size: 14px;
      letter-spacing: 0.4px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 40px;
      line-height: 48px;
      color: #221238;
    }

    .subtitle {
      margin: 0 auto 28px;
      max-width: 560px;
      font-size: 18px;
      line-height: 28px;
      color: rgba(34, 18, 56, 0.75);
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 0 0 32px;
      text-align: left;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(40, 16, 66, 0.08);
      border-radius: 18px;
      padding: 18px 20px;
    }

    .info-label {
      font-size: 13px;
      color: rgba(34, 18, 56, 0.55);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 800;
      line-height: 26px;
      color: #221238;
    }

    .section {
      text-align: left;
      margin-bottom: 32px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(40, 16, 66, 0.08);
      border-radius: 20px;
      padding: 24px;
    }

    .section h2 {
      margin: 0 0 14px;
      font-size: 22px;
      color: #221238;
    }

    .section ul {
      margin: 0;
      padding-left: 20px;
      color: rgba(34, 18, 56, 0.85);
      line-height: 28px;
      font-size: 17px;
    }

    .button-wrap {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }

    add-to-calendar-button {
      --atcb-button-box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
      --atcb-button-border-radius: 18px;
      --atcb-button-padding: 20px 34px;
      --atcb-button-font-size: 22px;
      --atcb-button-font-weight: 700;

      --atcb-button-text: #221238;
      --atcb-button-background: #ffffff;
      --atcb-button-hover-background: #f4f1fb;
      --atcb-button-active-background: #ece7f8;

      --atcb-dropdown-background: #ffffff;
      --atcb-dropdown-text: #221238;
      --atcb-dropdown-border-radius: 16px;
      --atcb-dropdown-box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      --atcb-dropdown-item-hover-background: #f4f1fb;
    }

    .footer {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(34, 18, 56, 0.55);
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px 20px;
        border-radius: 22px;
      }

      h1 {
        font-size: 30px;
        line-height: 38px;
      }

      .subtitle {
        font-size: 16px;
        line-height: 24px;
      }

      .info {
        grid-template-columns: 1fr;
      }

      .info-value {
        font-size: 17px;
      }

      add-to-calendar-button {
        --atcb-button-width: 100%;
        --atcb-button-padding: 18px 24px;
        --atcb-button-font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Team Event</div>

    <h1>Weekly Meeting</h1>
    <p class="subtitle">
      Team meeting with global discussion.
    </p>

    <div class="info">
      <div class="info-box">
        <div class="info-label">Date</div>
        <div class="info-value">13 May 2026</div>
      </div>
      <div class="info-box">
        <div class="info-label">Time</div>
        <div class="info-value">16:30 – 17:30</div>
      </div>
      <div class="info-box">
        <div class="info-label">Timezone</div>
        <div class="info-value">Europe/Warsaw</div>
      </div>
      <div class="info-box">
        <div class="info-label">Location</div>
        <div class="info-value">Office</div>
      </div>
    </div>

    <div class="section">
      <h2>Agenda</h2>
      <ul>
        <li>Global team discussion</li>
        <li>Private discussions</li>
      </ul>
    </div>

    <div class="button-wrap">
      <add-to-calendar-button
        name="Weekly Meeting"
        startDate="2026-05-13"
        startTime="16:30"
        endTime="17:30"
        timeZone="Europe/Warsaw"
        location="Office"
        description="Team meeting with global discussion first, followed by personal discussions."
        options="'Apple','Google','iCal'"
        label="Add to Calendar"
        size="8"
        lightMode="light"
        hideCheckmark
      ></add-to-calendar-button>
    </div>

    <div class="footer">
      Please add the event to your calendar in advance.
    </div>
  </div>
</body>
</html>
